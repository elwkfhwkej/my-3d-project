<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Модель Автомобиля</title>
    <style>
        /* Красивый градиентный фон (как в автосалоне) */
        body { 
            margin: 0; 
            overflow: hidden; 
            /* Переход от темно-серого к глубокому синему */
            background: radial-gradient(circle at center, #443222 0%, #0d0d30 100%);
            font-family: sans-serif;
        }
        /* Убираем стандартные отступы холста, чтобы он занимал весь экран */
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <script type="module" src="/main.js"></script>
</body>
</html>
